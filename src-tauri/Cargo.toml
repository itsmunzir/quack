[package]
name = "quack"
version = "0.1.4"
description = "Quack, a fast, open source, offline API client. No account, no cloud, no telemetry."
edition.workspace = true
license.workspace = true

[lib]
name = "quack_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1", features = ["sync", "macros", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "native-tls",
  "http2",
  "charset",
  "system-proxy",
  "cookies",
  "gzip",
  "brotli",
  "zstd",
  "deflate",
  "socks",
  "multipart",
] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
