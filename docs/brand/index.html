<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quack Sticker Icons</title>
<style>
  body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: #f1f1ef; color: #171717; padding: 32px 20px; }
  h1 { margin: 0 0 4px; font-size: 26px; } p.lead { margin: 0 0 22px; color: #666; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #e6e6e3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .card h2 { margin: 0; font-size: 16px; }
  .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .row img { display: block; }
  .taskbar { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 14px; border-radius: 10px; }
  .taskbar.dark { background: #1c1c1c; } .taskbar.light { background: #e8eaee; }
  .slot { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; }
  .slot.on { background: rgb(255 255 255 / .08); } .light .slot.on { background: rgb(0 0 0 / .06); }
  .slot i { width: 24px; height: 24px; border-radius: 6px; background: #8a8f98; opacity: .35; display: block; }
  .titlebar { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #e6e6e3; background: #fafafa; font-weight: 600; font-size: 13px; }
  .tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px 8px 0 0; background: #dee1e6; font-size: 12px; }
  .lbl { font: 600 11px ui-monospace, Consolas, monospace; color: #888; text-transform: uppercase; letter-spacing: .06em; }
</style>
<h1>Sticker-style duck</h1>
<p class="lead">Just the duck's silhouette in white with an eye, on a colored tile with a hand-drawn outline. Shown big, in a Windows taskbar, in the title bar and in a browser tab.</p>
<div class="grid" id="g"></div>
<script>
const v = [["sticker-mono","Black & white (main icon)"],["sticker-dark","Dark tile (alternate)"],["sticker-yellow","Yellow (alternate)"]];
const other = (n) => [1,2,3].map(() => `<div class="slot"><i></i></div>`).join("");
document.getElementById("g").innerHTML = v.map(([f, name]) => `
  <section class="card">
    <h2>${name}</h2>
    <div class="row">
      <img src="${f}.svg" width="160"><img src="${f}.svg" width="64"><img src="${f}.svg" width="32"><img src="${f}.svg" width="20"><img src="${f}.svg" width="16">
    </div>
    <div class="lbl">Taskbar</div>
    <div class="row">
      <div class="taskbar dark">${other()}<div class="slot on"><img src="${f}.svg" width="24"></div>${other()}</div>
      <div class="taskbar light">${other()}<div class="slot on"><img src="${f}.svg" width="24"></div>${other()}</div>
    </div>
    <div class="row">
      <div class="titlebar"><img src="${f}.svg" width="20">Quack</div>
      <div class="tab"><img src="${f}.svg" width="16">Quack</div>
    </div>
  </section>`).join("");
</script>
