name: Feature request
description: Suggest something Quack should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you're trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Rough is fine.
  - type: textarea
    id: elsewhere
    attributes:
      label: Seen it elsewhere?
      description: If another tool does this well, say which and how.
